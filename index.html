<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RC Flight Sim — S.E.5a</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="analog"></div>
    <canvas id="osd"></canvas>
    <button id="menu-btn" title="Menu (Esc)">☰</button>
    <div id="panel"></div>
    <div id="splash">
      <div class="card">
        <h1>RC Flight Sim</h1>
        <p class="sub">Royal Aircraft Factory S.E.5a · 1/5 scale electric</p>
        <p>Plug in your transmitter (USB joystick mode) or fly with the keyboard.</p>
        <table>
          <tr><td>Arrows</td><td>Aileron / elevator</td></tr>
          <tr><td>A / D</td><td>Rudder</td></tr>
          <tr><td>W / S</td><td>Throttle up / down</td></tr>
          <tr><td>C</td><td>Camera: line of sight → FPV → chase</td></tr>
          <tr><td>R</td><td>Reset</td></tr>
          <tr><td>Esc</td><td>Menu &amp; transmitter setup</td></tr>
        </table>
        <button id="start">Fly</button>
      </div>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
